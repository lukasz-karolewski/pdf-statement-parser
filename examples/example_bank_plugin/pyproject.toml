[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "example-bank-statement-parser"
version = "0.1.0"
description = "Example statement-parser plugin for synthetic Example Bank text"
requires-python = ">=3.10"
dependencies = ["pdf-statement-parser"]

[project.entry-points."pdf_statement_parser.parsers"]
example-bank = "example_bank_plugin.parser:ExampleBankParser"

[tool.hatch.build.targets.wheel]
packages = ["example_bank_plugin"]
