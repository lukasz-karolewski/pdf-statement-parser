name: New statement format
description: Request support for a bank or statement type
title: "Statement format: "
labels: [new-format]
body:
  - type: markdown
    attributes:
      value: |
        Never upload real statements. Share only redacted `statement-parser dump`
        output. Replace names, addresses, account numbers, and amounts before
        posting.
  - type: input
    id: bank
    attributes:
      label: Bank or issuer
      placeholder: Example Bank
    validations:
      required: true
  - type: input
    id: account-type
    attributes:
      label: Account type
      placeholder: checking, savings, credit card, loan
    validations:
      required: true
  - type: textarea
    id: redacted-dump
    attributes:
      label: Redacted dump output
      description: Run `statement-parser dump statement.pdf --page 1` and redact it.
      render: text
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Mention consolidated statements, business accounts, or unusual sections.
